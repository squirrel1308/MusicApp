name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & setup Capacitor
        run: |
          mkdir -p www
          if [ -f index.html ] && [ ! -f www/index.html ]; then
            cp index.html www/
          fi
          npm install
          npm install -D @capacitor/assets || true
          npx cap add android || true
          if [ -f icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#000000' || true
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIA-AudioStudio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
